name: 每日權值股 AI 晨報

on:
  schedule:
    # 台灣時間 週一~週六 06:50 = UTC 週日~週五 22:50 (台灣是 UTC+8)
    - cron: "50 21 * * 0-5"
  # 允許在 GitHub 網頁上手動按按鈕，馬上跑一次來測試
  workflow_dispatch:
  # 🟢 新增此區塊：允許 Cloudflare Worker 透過 LINE 觸發
  repository_dispatch:
    types: [run-report]



# 需要 write 權限，讓 workflow 最後可以把 docs/（Dashboard 網頁）commit 回 repo
permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4
      
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'
            cache: 'pip'
      
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
        - name: Execute Main Script
          env:
            # LINE API 與目標發送者 ID
            LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
            USER_ID: ${{ secrets.USER_ID }}
            TARGET_USER_ID: ${{ github.event.client_payload.user_id }}
      
            # 靈活判斷參數來源 (優先序: Cloudflare Client Payload > 手動點擊 Inputs > 定時排程預設)
            STOCK_QUERY: ${{ github.event.client_payload.query || inputs.query || '2330' }}
            RUN_MODE: ${{ github.event.client_payload.mode || inputs.mode || (github.event_name == 'schedule' && 'morning_report' || 'single_stock') }}
      
            # 晨報、AI 摘要與 Email 相關 Secrets
            EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
            EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
            RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
            OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          run: python main.py

      
        - name: 更新 Dashboard（把 docs/ 變更 commit 回 repo）
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs
            git diff --cached --quiet || git commit -m "📊 更新每日 Dashboard $(date +'%Y-%m-%d')"
            git push
